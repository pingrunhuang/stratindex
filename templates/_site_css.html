<style>
:root {
  --bg:#000; --panel:#0d0d0d; --line:#262626; --text:#fff;
  --muted:#a3a3a3; --faint:#858585; --signal:#5aabff;
  --danger:#ff6b6b; --good:#4ade80; --hatch:#1c1c1c; --wash:#ffffff0d;
  --marquee-h:2.5rem;
  --banner-bg:#060d15; --bar-bg:#0a0a0a; --btn-bg:#fff; --btn-fg:#000; --body-text:#ddd; --pre-text:#e6e6e6;
  --font-sans:"Funnel Sans",ui-sans-serif,system-ui,sans-serif;
  --font-display:"Funnel Display","Funnel Sans",ui-sans-serif,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;color-scheme:dark}
body{
  font-family:var(--font-sans);background:var(--bg);
  background-image:repeating-linear-gradient(-45deg,transparent 0 5px,var(--hatch) 5px 6px);
  color:var(--text);padding:0 6px;font-size:14px;line-height:1.5;font-weight:600;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
a{color:inherit;text-decoration:none}
a:hover{color:var(--signal)}
.frame{
  max-width:68rem;margin:0 auto;height:calc(100vh - var(--marquee-h));
  background:var(--bg);border-inline:1px dashed var(--line);
  display:flex;flex-direction:column;overflow:hidden;
}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700}
.label{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
.mock-banner{
  font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  text-align:center;padding:4px;color:var(--faint);border-bottom:1px dashed var(--line);background:var(--banner-bg);flex-shrink:0;font-weight:700;
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 20px;border-bottom:1px dashed var(--line);flex-shrink:0;
}
.wordmark{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:-.02em}
.wordmark img.logo{width:32px;height:32px;border-radius:6px;object-fit:cover;flex-shrink:0;display:block}
.wordmark span{color:var(--faint);font-weight:600}
.nav{display:flex;flex-wrap:wrap;gap:16px}
.nav a{font-size:13px;color:var(--muted);font-weight:700}
.nav a.active{color:var(--text)}
.status{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 20px;
  padding:12px 20px;border-bottom:1px dashed var(--line);flex-shrink:0;
}
.status-count{font-size:20px;font-weight:700;letter-spacing:-.03em}
.status-count .n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700}
.status-meta{font-family:var(--font-mono);font-size:11px;color:var(--faint);display:flex;flex-wrap:wrap;gap:6px 16px;font-weight:600}
.status-meta .live{color:var(--signal);font-weight:700}
.layout{display:grid;grid-template-columns:15rem 1fr;flex:1;min-height:0;overflow:hidden}
.rail{
  border-right:1px dashed var(--line);padding:16px 14px;overflow-y:auto;
  display:flex;flex-direction:column;gap:4px;scroll-margin-top:8px;
}
.rail h2{margin:14px 0 6px;font-weight:700;scroll-margin-top:8px}
.rail h2:first-child{margin-top:0}
.filter-list{list-style:none;display:flex;flex-direction:column;gap:3px}
.filter-list a, .filter-list button{
  width:100%;text-align:left;background:transparent;border:1px solid transparent;
  color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:6px 8px;border-radius:4px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;text-decoration:none;
}
.filter-list a.active, .filter-list button.active{border-color:var(--line);background:var(--panel);color:var(--text);font-weight:700}
.filter-list .cnt{font-family:var(--font-mono);font-size:11px;color:var(--faint);font-weight:500}
.sort-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{
  font-family:var(--font-mono);font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);padding:4px 8px;border-radius:4px;cursor:pointer;text-decoration:none;
}
.chip.active{color:var(--text);border-color:var(--faint)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.band{
  padding:10px 20px;border-bottom:1px dashed var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bar-bg);
}
.band h2{font-size:13px;font-weight:700}
.band a{font-family:var(--font-mono);font-size:11px;color:var(--faint);font-weight:600}
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.row{
  display:flex;gap:14px;align-items:flex-start;padding:14px 20px;line-height:1.5;
  border-bottom:1px dashed var(--line);flex:0 0 auto;
}
.row:hover{background:var(--wash)}
.badge{
  flex-shrink:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:5px;background:var(--panel);border:1px solid var(--line);
  font-family:var(--font-mono);font-size:11px;color:var(--muted);font-weight:700;
}
.row-body{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thesis{color:var(--muted);font-size:13px;font-weight:600;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px;max-width:62ch}
.metrics{
  display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--font-mono);font-size:11px;
  font-variant-numeric:tabular-nums;color:var(--faint);margin-bottom:6px;font-weight:500;
}
.metrics .v{color:var(--text);font-weight:700}.metrics .up{color:var(--good)}.metrics .dn{color:var(--danger)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-family:var(--font-mono);font-size:11px;color:var(--faint);font-weight:600}
.tag{border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--muted);font-weight:600}
.badge-new{
  color:var(--signal);border:1px solid color-mix(in oklab,var(--signal) 45%,transparent);
  background:color-mix(in oklab,var(--signal) 12%,transparent);border-radius:3px;padding:1px 6px;
  text-transform:uppercase;letter-spacing:.06em;font-size:10px;font-weight:700;
}
.actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.actions a, .actions button{
  font:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:5px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--muted);white-space:nowrap;
  text-align:center;text-decoration:none;
}
.actions .primary{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg);font-weight:700}
.actions button.is-saved{
  color:var(--signal);border-color:color-mix(in oklab,var(--signal) 50%,transparent);
  background:color-mix(in oklab,var(--signal) 12%,transparent);
}
.actions button.is-liked{
  color:var(--signal);border-color:color-mix(in oklab,var(--signal) 50%,transparent);
  background:color-mix(in oklab,var(--signal) 12%,transparent);
}
.styles-row{
  flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 20px;
  border-top:1px dashed var(--line);overflow:hidden;scroll-margin-bottom:3rem;
}
.styles-row .pill{
  font-family:var(--font-mono);font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:999px;
  padding:4px 10px;color:var(--muted);white-space:nowrap;background:var(--panel);
}
.styles-row .pill b{color:var(--text);font-weight:700;margin-left:4px}
.footer{
  flex-shrink:0;padding:8px 20px;border-top:1px dashed var(--line);
  font-size:11px;color:var(--faint);display:flex;gap:12px;align-items:center;font-weight:600;
}
.footer a{color:var(--muted);font-weight:700}
.marquee{
  position:fixed;left:0;right:0;bottom:0;z-index:40;height:var(--marquee-h);
  border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:stretch;overflow:hidden;
  scroll-margin-bottom:0;
}
.marquee-label{
  flex-shrink:0;display:flex;align-items:center;padding:0 10px;border-right:1px solid var(--line);
  font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;
}
.marquee-track-wrap{flex:1;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent)}
.marquee-track{display:flex;width:max-content;height:100%;align-items:center;animation:crawl 50s linear infinite}
.marquee-track:hover{animation-play-state:paused}
@keyframes crawl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.sponsor{
  display:inline-flex;align-items:center;gap:8px;padding:0 16px;font-family:var(--font-mono);
  font-size:10px;white-space:nowrap;color:var(--muted);border-right:1px dashed var(--line);height:100%;font-weight:600;
}
.sponsor .logo{
  width:18px;height:18px;border-radius:3px;border:1px solid var(--line);background:var(--bg);
  display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:var(--text);font-weight:700;
}
.sponsor .name{color:var(--text);font-size:11px;font-weight:700}
.sponsor .tagline{color:var(--faint)}
.sponsor.cta{
  color:var(--signal);border:1px dashed color-mix(in oklab,var(--signal) 40%,transparent);
  border-radius:5px;margin:0 10px;padding:0 12px;height:calc(100% - 8px);align-self:center;
}
.sponsor.cta .name{color:var(--signal)}
.saved-empty{display:none;padding:28px 20px;color:var(--muted);font-size:14px;font-weight:600;line-height:1.6}
@media (max-width:720px){
  .layout{grid-template-columns:1fr}
  .rail{display:none}
  body{overflow:auto}
  .frame{height:auto;min-height:calc(100vh - var(--marquee-h))}
}
html[data-theme="light"]{
  --bg:#f4f1ea; --panel:#fffdf8; --line:#8a857c; --text:#141414;
  --muted:#4a4740; --faint:#6b675e; --signal:#1a6fb5;
  --danger:#b42318; --good:#1f7a3a; --hatch:#e6e1d6; --wash:#0000000a;
  --banner-bg:#e8eef5; --bar-bg:#ece8de; --btn-bg:#141414; --btn-fg:#f7f5f0; --body-text:#262420; --pre-text:#1e1e1e;
}
html[data-theme="dark"]{color-scheme:dark} html[data-theme="light"]{color-scheme:light}
.theme-toggle{font:inherit;font-family:var(--font-mono);font-size:11px;font-weight:700;padding:4px 10px;border-radius:5px;border:1px dashed var(--line);background:var(--panel);color:var(--text);cursor:pointer;white-space:nowrap}
.theme-toggle:hover{border-color:var(--signal);color:var(--signal)}
</style>
